# VFX Orchestrator Agent Presets
# Select preset via: ORCHESTRATOR_PRESET=quick_test
#
# Available models (from OpenAI Platform docs):
#   gpt-5.4       - Frontier default for complex professional work
#   gpt-5.2       - Previous frontier model, supports temperature ONLY when reasoning_effort=none
#   gpt-5.3-codex - Coding-specialized model for Codex-like environments
#   gpt-5-mini    - Fast, cost-effective (NO temperature support)
#   gpt-5-nano    - Fastest, lowest cost (NO temperature support)
#
# Parameter compatibility:
#   - temperature/top_p/logprobs: ONLY gpt-5.4/gpt-5.2/gpt-5.1 with reasoning_effort=none
#   - gpt-5.3-codex/gpt-5-mini/gpt-5-nano: Use text.verbosity and max_output_tokens instead
#
# Reasoning effort: none, low, medium, high, xhigh

presets:
  # Fast iteration - minimal cost, quick feedback
  quick_test:
    description: "Fast iteration with minimal cost (gpt-5-mini)"
    default_model: gpt-5-mini
    reasoning_effort: low
    # No temperature - gpt-5-mini doesn't support it
    verbosity: medium
    max_output_tokens: 2000
    max_turns: 5
    max_iterations: 2
    stateless_iterations: true  # Phase 2B-1: Fresh context per iteration
    multi_grader_eval: true     # Phase 2B-3: Deterministic checks before LLM vision
    hitl_enabled: true          # Phase 2B-5: HITL checkpoints
    hitl_autonomy_level: 3      # Autonomous — only L4 escalation pauses
    hitl_interactive: false     # Non-interactive (fast, minimal pauses)
    memory_decay_enabled: true  # Phase 2B-6: Ebbinghaus decay on KB entries
    effect_type_scoping: true  # Phase 2B-7: KB entries scoped by effect type
    artifact_sharing: true     # Phase 2B-8: Agents read artifacts via tool instead of inline

  # Standard development - balanced cost/quality
  development:
    description: "Balanced settings for development (gpt-5-mini)"
    default_model: gpt-5-mini
    reasoning_effort: medium
    verbosity: medium
    max_output_tokens: 4000
    max_turns: 10
    max_iterations: 3
    stateless_iterations: true  # Phase 2B-1: Fresh context per iteration
    multi_grader_eval: true     # Phase 2B-3: Deterministic checks before LLM vision
    hitl_enabled: true          # Phase 2B-5: HITL checkpoints
    hitl_autonomy_level: 1      # Supervised — budget + critical + stall checkpoints
    hitl_interactive: true      # CLI prompts for human decisions
    memory_decay_enabled: true  # Phase 2B-6: Ebbinghaus decay on KB entries
    effect_type_scoping: true  # Phase 2B-7: KB entries scoped by effect type
    artifact_sharing: true     # Phase 2B-8: Agents read artifacts via tool instead of inline

  # Historical preset name retained for compatibility.
  # This rollout now upgrades code-critical agents to GPT-5.4.
  codex_upgrade:
    description: "Rollout preset: gpt-5.4 for code-critical agents"
    default_model: gpt-5-mini
    reasoning_effort: medium
    verbosity: medium
    max_output_tokens: 4000
    max_turns: 10
    max_iterations: 3
    stateless_iterations: true  # Phase 2B-1: Fresh context per iteration
    multi_grader_eval: true     # Phase 2B-3: Deterministic checks before LLM vision
    hitl_enabled: true          # Phase 2B-5: HITL checkpoints
    hitl_autonomy_level: 1      # Supervised rollout
    hitl_interactive: false      # Human checkpoints during rollout
    memory_decay_enabled: true  # Phase 2B-6: Ebbinghaus decay on KB entries
    effect_type_scoping: true  # Phase 2B-7: KB entries scoped by effect type
    artifact_sharing: true     # Phase 2B-8: Agents read artifacts via tool instead of inline
    agent_overrides:
      # Primary code generation path
      script_writer:
        model: gpt-5.4
        reasoning_effort: high
        max_output_tokens: 25000
        verbosity: medium
      # Strategy is tightly coupled to script generation quality
      modification_coordinator:
        model: gpt-5.4
        reasoning_effort: high
        max_output_tokens: 2000
        max_turns: 4
      # Research output quality materially impacts generated scripts
      research_agent:
        model: gpt-5.4
        reasoning_effort: high
        max_output_tokens: 4000
      # Vision analysis benefits from gpt-5.4's better image understanding
      quality_analyst:
        model: gpt-5.4
        reasoning_effort: high
        max_output_tokens: 10000

  # Full quality - best results, higher cost
  production:
    description: "Maximum quality for final assets (gpt-5.2)"
    default_model: gpt-5.2
    reasoning_effort: medium
    # No temperature when using reasoning
    verbosity: high
    max_output_tokens: 8000
    max_turns: 15
    max_iterations: 5
    stateless_iterations: true  # Phase 2B-1: Fresh context per iteration
    multi_grader_eval: true     # Phase 2B-3: Deterministic checks before LLM vision
    hitl_enabled: true          # Phase 2B-5: HITL checkpoints
    hitl_autonomy_level: 2      # Semi-autonomous — only critical checkpoints
    hitl_interactive: false     # File-based decisions (no CLI blocking)
    memory_decay_enabled: true  # Phase 2B-6: Ebbinghaus decay on KB entries
    effect_type_scoping: true  # Phase 2B-7: KB entries scoped by effect type
    artifact_sharing: true     # Phase 2B-8: Agents read artifacts via tool instead of inline

  # Budget saver - absolute minimum
  budget_saver:
    description: "Minimum cost, basic functionality (gpt-5-nano)"
    default_model: gpt-5-nano
    reasoning_effort: low
    verbosity: low
    max_output_tokens: 1000
    max_turns: 3
    max_iterations: 1
    stateless_iterations: true  # Phase 2B-1: Fresh context per iteration
    multi_grader_eval: true     # Phase 2B-3: Deterministic checks before LLM vision
    hitl_enabled: true          # Phase 2B-5: HITL checkpoints
    hitl_autonomy_level: 0      # Guided — all checkpoints fire
    hitl_interactive: true      # CLI prompts for every checkpoint
    memory_decay_enabled: true  # Phase 2B-6: Ebbinghaus decay on KB entries
    effect_type_scoping: true  # Phase 2B-7: KB entries scoped by effect type
    artifact_sharing: true     # Phase 2B-8: Agents read artifacts via tool instead of inline

  # Debug mode - verbose, detailed tracing
  debug:
    description: "Verbose output for debugging (gpt-5-mini)"
    default_model: gpt-5-mini
    reasoning_effort: low
    verbosity: high
    max_output_tokens: 4000
    max_turns: 8
    max_iterations: 2
    verbose: true
    stateless_iterations: false  # Keep session for conversation inspection
    multi_grader_eval: true     # Phase 2B-3: Deterministic checks before LLM vision
    hitl_enabled: true          # Phase 2B-5: HITL checkpoints
    hitl_autonomy_level: 0      # Guided — all checkpoints fire (debug everything)
    hitl_interactive: true      # CLI prompts for debugging
    memory_decay_enabled: false # Phase 2B-6: Disabled — see all patterns when debugging
    effect_type_scoping: false # Phase 2B-7: Disabled — see all effect types when debugging
    artifact_sharing: true     # Phase 2B-8: Agents read artifacts via tool instead of inline

  # Reasoning mode - uses full reasoning for complex tasks
  reasoning:
    description: "Uses high reasoning for complex decisions (gpt-5.2)"
    default_model: gpt-5.2
    reasoning_effort: high
    verbosity: medium
    max_output_tokens: 8000
    max_turns: 10
    max_iterations: 3
    stateless_iterations: true  # Phase 2B-1: Fresh context per iteration
    multi_grader_eval: true     # Phase 2B-3: Deterministic checks before LLM vision
    hitl_enabled: true          # Phase 2B-5: HITL checkpoints
    hitl_autonomy_level: 2      # Semi-autonomous — only critical checkpoints
    hitl_interactive: true      # CLI prompts for critical decisions
    memory_decay_enabled: true  # Phase 2B-6: Ebbinghaus decay on KB entries
    effect_type_scoping: true  # Phase 2B-7: KB entries scoped by effect type
    artifact_sharing: true     # Phase 2B-8: Agents read artifacts via tool instead of inline

  # Creative mode - gpt-5.2 with temperature (reasoning=none)
  creative:
    description: "Creative mode with temperature control (gpt-5.2, no reasoning)"
    default_model: gpt-5.2
    reasoning_effort: none
    temperature: 0.7
    max_output_tokens: 4000
    max_turns: 10
    max_iterations: 3
    stateless_iterations: true  # Phase 2B-1: Fresh context per iteration
    multi_grader_eval: true     # Phase 2B-3: Deterministic checks before LLM vision
    hitl_enabled: true          # Phase 2B-5: HITL checkpoints
    hitl_autonomy_level: 1      # Supervised — human guides creative direction
    hitl_interactive: true      # CLI prompts for creative decisions
    memory_decay_enabled: true  # Phase 2B-6: Ebbinghaus decay on KB entries
    effect_type_scoping: true  # Phase 2B-7: KB entries scoped by effect type
    artifact_sharing: true     # Phase 2B-8: Agents read artifacts via tool instead of inline

# Per-agent overrides (applied on top of preset defaults)
# These apply globally across all presets.
#
# Configuration philosophy (2026-01-28):
#   - AI-to-AI communication should be structured and concise, not verbose prose
#   - verbosity: medium/low for agent-to-agent handoffs (structured Pydantic output)
#   - verbosity: high ONLY for Quality Analyst (human-readable diagnostic detail)
#   - reasoning_effort: high for agents whose mistakes cascade (code gen, evaluation, strategy)
#   - max_output_tokens: sized to actual output (scripts need 25k, decisions need 1-2k)
#
# Research backing:
#   - CodeAgents (arXiv 2507.03254): structured > verbose NL for accuracy AND cost
#   - Anthropic multi-agent system: lightweight references, not full prose payloads
#   - "Why do AI agents communicate in human language?" (arXiv 2506.02739):
#     NL causes semantic redundancy, ambiguity, lossy compression between agents
#
# Model tiers:
#   gpt-5.4  → frontier default for mixed engineering/planning workflows
#   gpt-5.2  → complex reasoning, code generation, evaluation
#   gpt-5.3-codex → coding-specialized model (available, no longer rollout default)
#   gpt-5-mini → simple/formulaic tasks (routing, execution, pass/fail)
agent_overrides:

  # === TIER 1: Full power (gpt-5.2, high reasoning) ===
  # These agents do the hardest cognitive work. Mistakes here cascade.

  # Script Writer: code generation is the hardest task
  # 25k output budget — scripts can be 200-300 lines, was truncating at 2k
  script_writer:
    model: gpt-5.2
    reasoning_effort: high
    max_output_tokens: 25000
    verbosity: medium

  # Quality Analyst: vision-based evaluation needs nuanced judgment
  # High verbosity HERE because detailed issue descriptions help debugging
  quality_analyst:
    model: gpt-5.2
    reasoning_effort: high
    max_output_tokens: 10000
    verbosity: high

  # Modification Strategist: classifying structural vs parameter failures
  # THE breakthrough agent — correct classification drives quality
  modification_coordinator:
    model: gpt-5.2
    reasoning_effort: high
    max_output_tokens: 2000
    max_turns: 4

  # Research Agent: document interpretation, technique recommendation
  # Runs once per session (Phase 0) + technique switches — high reasoning amortized
  research_agent:
    model: gpt-5.2
    reasoning_effort: high
    max_output_tokens: 4000

  # === TIER 2: Smart but efficient (gpt-5.2, medium reasoning) ===

  # Learning Agent: pattern extraction and experiment analysis
  learning_agent:
    model: gpt-5.2
    reasoning_effort: medium
    max_output_tokens: 4000
    verbosity: medium

  # === TIER 3: Fast workers (preset default = gpt-5-mini) ===
  # Simple classification, parsing, pass/fail — no need for deep thinking

  # Technique Selector: pick from a catalog
  technique_coordinator:
    reasoning_effort: low
    max_output_tokens: 2000
    max_turns: 3

  # Quality Gate Judge: numeric pass/fail + escape level
  quality_gate_coordinator:
    reasoning_effort: low
    max_output_tokens: 1000
    max_turns: 3

  # Docs Expert: Blender 5.0 documentation search
  # Used in parallel preflight for API verification
  docs_expert:
    model: gpt-5-mini
    reasoning_effort: low
    max_output_tokens: 2000
    max_turns: 3

  # Executor: runs Blender, parses stdout — uses preset default (gpt-5-mini)
  # No override needed
