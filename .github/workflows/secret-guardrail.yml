name: '🛡️ Secret Guardrail'

on:
  pull_request:
  push:

jobs:
  env-example-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run secret guardrail
        run: python3 scripts/secret_guardrail.py

